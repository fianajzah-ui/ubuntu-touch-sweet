name: Build UT Sweet
on:
  workflow_dispatch:
  push:
    branches: [ main, lineage-24.0 ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y bc bison build-essential curl flex git \
            libssl-dev libelf-dev lz4 wget xz-utils zip python3 gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf make clang llvm lld


      - name: Clone Kernel Source
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== CLONE SWEET KERNEL ==="

          git clone --depth=1 \
            --single-branch \
            -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git \
            kernel

          echo "=== VERIFY KERNEL ==="
          test -f kernel/Makefile

          cd kernel
          echo "=== KERNEL SOURCE READY ==="
          ls -la
          git log -1 --oneline


      - name: Build Kernel
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CC=clang sweet_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-sweet
          path: |
            kernel/arch/arm64/boot/Image
            kernel/arch/arm64/boot/dtbo.img
            kernel/arch/arm64/boot/dts/qcom/sm7150-sweet.dtb
          retention-days: 30
