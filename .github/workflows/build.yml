name: Build UT Sweet
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory '*'

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y bc bison build-essential curl flex git \
            libssl-dev libelf-dev lz4 wget xz-utils zip python3 gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf make

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_xiaomi_sm7150.git kernel
          cd kernel && ls -la

      - name: Download AOSP Clang Toolchain
        run: |
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r487747.tar.gz" -O clang.tar.gz
          mkdir clang
          tar xf clang.tar.gz -C clang
          echo "CLANG_DIR=$PWD/clang" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$PWD/../clang/bin:$PATH"
          make -j$(nproc) ARCH=arm64 CC=clang sweet_defconfig
          make -j$(nproc) ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
