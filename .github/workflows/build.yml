
name: Native Sweet ARM64 Rootfs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sweet-rootfs
  cancel-in-progress: true

jobs:
  build-rootfs:
    name: Build Ubuntu Noble ARM64 + Lomiri
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare output directory
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          chmod 0777 "$GITHUB_WORKSPACE/out"

          echo "=== HOST OUTPUT DIRECTORY ==="
          ls -ld "$GITHUB_WORKSPACE/out"

      - name: Build Ubuntu ARM64 RootFS
        run: |
          set -Eeuo pipefail

          docker run --rm \
            --platform linux/arm64 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/out,target=/out" \
            ubuntu:24.04 \
            bash -Eeuo pipefail -c '

              export DEBIAN_FRONTEND=noninteractive
              export TZ=Asia/Jakarta
              umask 022

              echo "=== CHECK DOCKER OUTPUT MOUNT ==="
              ls -ld /out
              touch /out/docker-write-test
              ls -lah /out

              echo "=== UPDATE UBUNTU ==="
              apt-get update

              echo "=== INSTALL BASE SYSTEM ==="
              apt-get install -y --no-install-recommends \
                systemd \
                systemd-sysv \
                dbus \
                dbus-user-session \
                sudo \
                udev \
                kmod \
                initramfs-tools \
                initramfs-tools-core \
                network-manager \
                iproute2 \
                iputils-ping \
                net-tools \
                openssh-server \
                curl \
                wget \
                git \
                nano \
                vim-tiny \
                less \
                bash-completion \
                pciutils \
                usbutils \
                xz-utils \
                zstd \
                rsync \
                parted \
                e2fsprogs \
                dosfstools \
                file \
                ca-certificates \
                locales \
                tzdata

              echo "=== INSTALL LOMIRI ==="
              apt-get install -y lomiri

              echo "=== CONFIGURE ROOTFS ==="
              echo "sweet" > /etc/hostname

              cat > /etc/hosts << "EOF"
              127.0.0.1 localhost
              127.0.1.1 sweet
              ::1 localhost ip6-localhost ip6-loopback
              EOF

              locale-gen en_US.UTF-8
              update-locale LANG=en_US.UTF-8

              ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
              echo "Asia/Jakarta" > /etc/timezone

              passwd -l root || true

              mkdir -p /proc /sys /dev /run /tmp
              chmod 0755 /proc /dev /run
              chmod 1777 /tmp

              echo "=== CREATE BUILD INFO ==="
              cat > /out/build-info.txt << EOF
              DEVICE=sweet
              ARCH=arm64
              OS=Ubuntu 24.04 Noble
              DESKTOP=Lomiri
              INIT=systemd
              BUILD_TYPE=rootfs-only
              FLASHABLE=no
              DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              EOF

              echo "=== PREPARE MOUNTPOINTS ==="
              mkdir -p /out/mountpoints/proc
              mkdir -p /out/mountpoints/sys
              mkdir -p /out/mountpoints/dev
              mkdir -p /out/mountpoints/run
              mkdir -p /out/mountpoints/tmp

              chmod 0755 \
                /out/mountpoints/proc \
                /out/mountpoints/sys \
                /out/mountpoints/dev \
                /out/mountpoints/run

              chmod 1777 /out/mountpoints/tmp

              echo "=== EXPORT ROOTFS ==="
              tar \
                --numeric-owner \
                --xattrs \
                --acls \
                --exclude=./proc \
                --exclude=./sys \
                --exclude=./dev \
                --exclude=./run \
                --exclude=./tmp \
                --exclude=./out \
                -cpf /out/ubuntu-noble-sweet-arm64.tar \
                -C / .

              echo "=== ADD EMPTY MOUNTPOINTS ==="
              tar \
                --numeric-owner \
                --append \
                -f /out/ubuntu-noble-sweet-arm64.tar \
                -C /out/mountpoints \
                proc sys dev run tmp

              echo "=== VERIFY INSIDE DOCKER ==="
              test -s /out/ubuntu-noble-sweet-arm64.tar
              test -s /out/build-info.txt

              archive_listing="$(tar -tf /out/ubuntu-noble-sweet-arm64.tar)"

              for dir in proc sys dev run tmp; do
                if ! printf "%s\n" "$archive_listing" | grep -Eq "^(\./)?${dir}/?$"; then
                  echo "ERROR: Mountpoint $dir tidak ditemukan!"
                  exit 1
                fi
                echo "Mountpoint $dir: OK"
              done

              echo "=== DOCKER OUTPUT FILES ==="
              ls -lah /out
              stat /out/ubuntu-noble-sweet-arm64.tar
              stat /out/build-info.txt

              echo "=== ROOTFS EXPORT COMPLETED ==="
            '

      - name: Inspect Host Output
        run: |
          set -Eeuo pipefail

          echo "=== HOST WORKSPACE ==="
          echo "$GITHUB_WORKSPACE"

          echo "=== HOST OUTPUT DIRECTORY ==="
          ls -lah "$GITHUB_WORKSPACE/out"

          echo "=== CHECK DOCKER WRITE TEST ==="
          if [ -f "$GITHUB_WORKSPACE/out/docker-write-test" ]; then
            echo "Docker bind mount: OK"
          else
            echo "ERROR: Docker output mount tidak terbaca oleh Runner"
            exit 1
          fi

          echo "=== CHECK ROOTFS FILE ==="
          if [ -s "$GITHUB_WORKSPACE/out/ubuntu-noble-sweet-arm64.tar" ]; then
            echo "RootFS TAR: FOUND"
            ls -lh "$GITHUB_WORKSPACE/out/ubuntu-noble-sweet-arm64.tar"
          else
            echo "ERROR: RootFS TAR tidak ditemukan atau kosong"
            find "$GITHUB_WORKSPACE/out" -maxdepth 3 -type f -printf '%p (%s bytes)\n'
            exit 1
          fi

          echo "=== CHECK BUILD INFO ==="
          if [ -s "$GITHUB_WORKSPACE/out/build-info.txt" ]; then
            echo "Build info: FOUND"
            cat "$GITHUB_WORKSPACE/out/build-info.txt"
          else
            echo "ERROR: build-info.txt tidak ditemukan atau kosong"
            exit 1
          fi

      - name: Create Checksum and Verify RootFS
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/out"

          echo "=== CREATE SHA256 ==="
          sha256sum ubuntu-noble-sweet-arm64.tar > SHA256SUMS

          echo "=== VERIFY SHA256 ==="
          sha256sum -c SHA256SUMS

          echo "=== VERIFY ARCHIVE MOUNTPOINTS ==="
          archive_listing="$(tar -tf ubuntu-noble-sweet-arm64.tar)"

          for dir in proc sys dev run tmp; do
            if ! printf '%s\n' "$archive_listing" | grep -Eq "^(\./)?${dir}/?$"; then
              echo "ERROR: Mountpoint $dir tidak ditemukan!"
              exit 1
            fi
            echo "Mountpoint $dir: OK"
          done

          echo "=== BUILD INFO ==="
          cat build-info.txt

          echo "=== ALL VERIFICATIONS PASSED ==="
          ls -lh ubuntu-noble-sweet-arm64.tar SHA256SUMS build-info.txt

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-noble-sweet-arm64-rootfs
          path: |
            out/ubuntu-noble-sweet-arm64.tar
            out/SHA256SUMS
            out/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
