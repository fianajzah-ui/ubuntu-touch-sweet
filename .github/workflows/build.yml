
name: Native Sweet ARM64 Rootfs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sweet-rootfs
  cancel-in-progress: true

jobs:
  build-rootfs:
    name: Build Ubuntu Noble ARM64 + Lomiri
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare output directory
        run: |
          mkdir -p out

      - name: Build Ubuntu ARM64 RootFS
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE/out:/out" \
            ubuntu:24.04 \
            bash -Eeuo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              export TZ=Asia/Jakarta
              umask 022

              echo "=== UPDATE UBUNTU ==="
              apt-get update

              echo "=== INSTALL BASE SYSTEM ==="
              apt-get install -y --no-install-recommends \
                systemd systemd-sysv dbus dbus-user-session \
                sudo udev kmod initramfs-tools initramfs-tools-core \
                network-manager iproute2 iputils-ping net-tools \
                openssh-server curl wget git nano vim-tiny less \
                bash-completion pciutils usbutils xz-utils zstd \
                rsync parted e2fsprogs dosfstools file \
                ca-certificates locales tzdata

              echo "=== INSTALL LOMIRI ==="
              apt-get install -y lomiri

              echo "=== CONFIGURE ROOTFS ==="
              echo "sweet" > /etc/hostname

              cat > /etc/hosts << "EOF"
              127.0.0.1 localhost
              127.0.1.1 sweet
              ::1 localhost ip6-localhost ip6-loopback
              EOF

              locale-gen en_US.UTF-8
              update-locale LANG=en_US.UTF-8

              ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
              echo "Asia/Jakarta" > /etc/timezone

              passwd -l root || true

              mkdir -p /proc /sys /dev /run /tmp
              chmod 0755 /proc /dev /run
              chmod 1777 /tmp

              echo "=== WRITE BUILD INFO ==="
              cat > /out/build-info.txt << EOF
              DEVICE=sweet
              ARCH=arm64
              OS=Ubuntu 24.04 Noble
              DESKTOP=Lomiri
              INIT=systemd
              BUILD_TYPE=rootfs-only
              FLASHABLE=no
              DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
              EOF

              echo "=== PREPARE EMPTY MOUNTPOINTS ==="
              mkdir -p /out/mountpoints/{proc,sys,dev,run,tmp}
              chmod 0755 /out/mountpoints/{proc,sys,dev,run}
              chmod 1777 /out/mountpoints/tmp

              echo "=== EXPORT ROOTFS ==="
              tar \
                --numeric-owner \
                --xattrs \
                --acls \
                --exclude=./proc \
                --exclude=./sys \
                --exclude=./dev \
                --exclude=./run \
                --exclude=./tmp \
                --exclude=./out \
                -cpf /out/ubuntu-noble-sweet-arm64.tar \
                -C / .

              echo "=== ADD EMPTY MOUNTPOINTS ==="
              tar \
                --numeric-owner \
                --append \
                -f /out/ubuntu-noble-sweet-arm64.tar \
                -C /out/mountpoints \
                proc sys dev run tmp

              echo "=== VERIFY ARCHIVE ==="
              archive_listing="$(tar -tf /out/ubuntu-noble-sweet-arm64.tar)"

              for dir in proc sys dev run tmp; do
                if ! printf "%s\n" "$archive_listing" | grep -Eq "^(\./)?${dir}/?$"; then
                  echo "ERROR: Mountpoint $dir tidak ditemukan!"
                  exit 1
                fi
                echo "Mountpoint $dir: OK"
              done

              echo "=== ROOTFS EXPORT COMPLETED ==="
              ls -lh /out/ubuntu-noble-sweet-arm64.tar
            '

      - name: Create Checksum and Verify RootFS
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/out"

          echo "=== CHECK OUTPUT FILES ==="
          test -s ubuntu-noble-sweet-arm64.tar
          test -s build-info.txt

          echo "=== CREATE SHA256 ==="
          sha256sum ubuntu-noble-sweet-arm64.tar > SHA256SUMS

          echo "=== VERIFY SHA256 ==="
          sha256sum -c SHA256SUMS

          echo "=== VERIFY ARCHIVE MOUNTPOINTS ==="
          archive_listing="$(tar -tf ubuntu-noble-sweet-arm64.tar)"

          for dir in proc sys dev run tmp; do
            if ! printf '%s\n' "$archive_listing" | grep -Eq "^(\./)?${dir}/?$"; then
              echo "ERROR: Mountpoint $dir tidak ditemukan!"
              exit 1
            fi
            echo "Mountpoint $dir: OK"
          done

          echo "=== BUILD INFO ==="
          cat build-info.txt

          echo "=== ALL VERIFICATIONS PASSED ==="
          ls -lh ubuntu-noble-sweet-arm64.tar SHA256SUMS build-info.txt

      - name: Upload RootFS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-noble-sweet-arm64-rootfs
          path: |
            out/ubuntu-noble-sweet-arm64.tar
            out/SHA256SUMS
            out/build-info.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
