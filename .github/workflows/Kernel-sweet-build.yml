
name: Sweet Kernel ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweet-kernel-build
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Linux Kernel for Redmi Note 10 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex build-essential \
            clang-18 lld-18 llvm-18 \
            libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 \
            dwarves device-tree-compiler

      - name: Checkout audited kernel source
        run: |
          set -e
          mkdir -p kernel
          git -C kernel init
          git -C kernel remote add origin \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git
          git -C kernel fetch --depth=1 origin \
            e03e5ba22586be70673afb5d3c3f70510524e658
          git -C kernel checkout FETCH_HEAD

          git -C kernel rev-parse HEAD \
            > kernel-commit.txt

      - name: Prepare Sweet native configuration
        run: |
          set -e

          KERNEL="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/kernel-out"

          mkdir -p "$OUT"

          cd "$KERNEL"

          make O="$OUT" ARCH=arm64 \
            CC=clang-18 LLVM=1 LLVM_IAS=1 \
            vendor/sdmsteppe-perf_defconfig

          cat > "$GITHUB_WORKSPACE/native.config" <<'EOF'
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_FUSE_FS=y
          EOF

          scripts/kconfig/merge_config.sh \
            -m -O "$OUT" \
            "$OUT/.config" \
            "$KERNEL/arch/arm64/configs/vendor/sweet.config" \
            "$GITHUB_WORKSPACE/native.config"

          make O="$OUT" ARCH=arm64 \
            CC=clang-18 LLVM=1 LLVM_IAS=1 \
            olddefconfig

      - name: Verify required configuration
        run: |
          set -e

          CONFIG="$GITHUB_WORKSPACE/kernel-out/.config"

          grep -qx 'CONFIG_DEVTMPFS=y' "$CONFIG"
          grep -qx 'CONFIG_DEVTMPFS_MOUNT=y' "$CONFIG"
          grep -qx 'CONFIG_FUSE_FS=y' "$CONFIG"
          grep -qx 'CONFIG_MACH_XIAOMI_SWEET=y' "$CONFIG"
          grep -qx 'CONFIG_TOUCHSCREEN_GOODIX_GTX9896_I2C=y' "$CONFIG"
          grep -qx 'CONFIG_TOUCHSCREEN_FTS_K6=y' "$CONFIG"

          echo "SWEET NATIVE CONFIGURATION VERIFIED"

      - name: Compile ARM64 kernel and device trees
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          make -j2 \
            O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 \
            CC=clang-18 \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz dtbs

      - name: Collect build outputs
        run: |
          set -e

          KERNEL="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          DIST="$GITHUB_WORKSPACE/dist"

          mkdir -p "$DIST/device-trees"

          IMAGE="$OUT/arch/arm64/boot/Image.gz"

          test -s "$IMAGE"
          cp "$IMAGE" "$DIST/Image.gz"

          if [ -d "$OUT/arch/arm64/boot/dts" ]; then
            find "$OUT/arch/arm64/boot/dts" \
              -type f \( -name '*.dtb' -o -name '*.dtbo' \) \
              -exec cp --parents {} "$DIST/device-trees/" \;
          fi

          cp "$OUT/.config" "$DIST/kernel.config"
          cp "$GITHUB_WORKSPACE/kernel-commit.txt" "$DIST/"

          {
            echo "Sweet ARM64 Kernel Build"
            echo "========================"
            echo
            echo "Source commit:"
            cat "$DIST/kernel-commit.txt"
            echo
            echo "Compiler:"
            clang-18 --version
            echo
            echo "Kernel image:"
            ls -lh "$DIST/Image.gz"
            echo
            echo "Device tree files:"
            find "$DIST/device-trees" -type f
          } > "$DIST/build-report.txt"

          cd "$DIST"
          sha256sum Image.gz kernel.config \
            kernel-commit.txt build-report.txt \
            > SHA256SUMS

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernel-arm64-build
          path: |
            dist/
            kernel-out/.config
          if-no-files-found: warn
          retention-days: 14
