
name: Sweet Kernel ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sweet-kernel-build
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build Linux Kernel for Redmi Note 10 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang-18 llvm-18 llvm-18-tools lld-18 \
            libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 \
            dwarves device-tree-compiler

      - name: Prepare and verify LLVM tools
        run: |
          set -e

          for tool in llvm-nm llvm-ar llvm-objdump; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              versioned="${tool}-18"

              if ! command -v "$versioned" >/dev/null 2>&1; then
                echo "ERROR: $versioned is missing"
                exit 1
              fi

              sudo ln -sf "$(command -v "$versioned")" "/usr/local/bin/$tool"
            fi
          done

          command -v llvm-nm
          command -v llvm-ar
          command -v llvm-objdump
          command -v ld.lld-18
          command -v clang-18
          command -v aarch64-linux-gnu-gcc

          llvm-nm --version
          llvm-ar --version
          llvm-objdump --version
          ld.lld-18 --version
          clang-18 --version

          echo "LLVM TOOLCHAIN VERIFIED"

      - name: Download audited Sweet kernel source
        run: |
          set -e

          git init kernel

          git -C kernel remote add origin \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git

          git -C kernel fetch --depth=1 origin \
            e03e5ba22586be70673afb5d3c3f70510524e658

          git -C kernel checkout FETCH_HEAD

          git -C kernel rev-parse HEAD > kernel-commit.txt

      - name: Prepare GCC compatibility wrapper
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          cat > "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -e

          args=()

          for arg in "$@"; do
            if [ "$arg" = "-mno-implicit-float" ]; then
              args+=("-mgeneral-regs-only")
            else
              args+=("$arg")
            fi
          done

          exec aarch64-linux-gnu-gcc "${args[@]}"
          EOF

          chmod +x "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          printf 'int test(void) { return 0; }\n' > test.c

          "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper" \
            -mno-implicit-float \
            -c test.c -o test.o

          test -s test.o

          echo "GCC WRAPPER TEST PASSED"

      - name: Fix compiler macro compatibility
        run: |
          set -e

          FILE="kernel/include/linux/compiler_types.h"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          marker = "#if __has_attribute(__fallthrough__)"

          fallback = (
              "#ifndef __has_attribute\n"
              "#define __has_attribute(x) 0\n"
              "#endif\n\n"
          )

          if marker not in source:
              raise SystemExit("ERROR: Expected compiler macro not found")

          if "#ifndef __has_attribute" not in source:
              source = source.replace(marker, fallback + marker, 1)
              path.write_text(source)

          print("Compiler macro compatibility verified")
          PY

      - name: Prepare Sweet native configuration
        run: |
          set -e

          KERNEL="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          CC_WRAPPER="$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          mkdir -p "$OUT"

          cd "$KERNEL"

          make O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            vendor/sdmsteppe-perf_defconfig

          cat > "$GITHUB_WORKSPACE/native.config" <<'EOF'
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_FUSE_FS=y
          EOF

          scripts/kconfig/merge_config.sh \
            -m -O "$OUT" \
            "$OUT/.config" \
            "$KERNEL/arch/arm64/configs/vendor/sweet.config" \
            "$GITHUB_WORKSPACE/native.config"

          make O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            olddefconfig

      - name: Verify kernel configuration
        run: |
          set -e

          CONFIG="$GITHUB_WORKSPACE/kernel-out/.config"

          test -s "$CONFIG"

          for symbol in \
            CONFIG_DEVTMPFS \
            CONFIG_DEVTMPFS_MOUNT \
            CONFIG_FUSE_FS \
            CONFIG_MACH_XIAOMI_SWEET \
            CONFIG_TOUCHSCREEN_GOODIX_GTX9896_I2C \
            CONFIG_TOUCHSCREEN_FTS_K6
          do
            if ! grep -qx "${symbol}=y" "$CONFIG"; then
              echo "ERROR: $symbol is not enabled"
              grep -E "^${symbol}=" "$CONFIG" || true
              exit 1
            fi
          done

          echo "SWEET NATIVE CONFIGURATION VERIFIED"

      - name: Compile ARM64 kernel and device trees
        run: |
          set -e

          cd "$GITHUB_WORKSPACE/kernel"

          CC_WRAPPER="$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          make -j2 \
            O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            LD=ld.lld-18 \
            KCFLAGS="-Wno-error=maybe-uninitialized -Wno-error=address" \
            Image.gz dtbs

          echo "KERNEL COMPILATION FINISHED"

      - name: Collect kernel build outputs
        if: success()
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/kernel-out"
          DIST="$GITHUB_WORKSPACE/dist"

          mkdir -p "$DIST"

          IMAGE="$OUT/arch/arm64/boot/Image.gz"
          DTB_DIR="$OUT/arch/arm64/boot/dts"

          test -s "$IMAGE"

          cp "$IMAGE" "$DIST/Image.gz"
          cp "$OUT/.config" "$DIST/kernel.config"
          cp "$GITHUB_WORKSPACE/kernel-commit.txt" "$DIST/"

          if [ -d "$DTB_DIR" ]; then
            tar -czf "$DIST/device-trees.tar.gz" \
              -C "$OUT/arch/arm64/boot" dts
          fi

          {
            echo "Sweet ARM64 Kernel Build Report"
            echo "================================"
            echo
            echo "Kernel commit:"
            cat "$DIST/kernel-commit.txt"
            echo
            echo "Compiler:"
            aarch64-linux-gnu-gcc --version
            echo
            echo "Linker:"
            ld.lld-18 --version
            echo
            echo "Kernel image:"
            ls -lh "$DIST/Image.gz"
            echo
            echo "Device trees:"
            if [ -f "$DIST/device-trees.tar.gz" ]; then
              ls -lh "$DIST/device-trees.tar.gz"
            else
              echo "DTB archive not found"
            fi
            echo
            echo "Native configuration:"
            grep -E '^(CONFIG_DEVTMPFS|CONFIG_DEVTMPFS_MOUNT|CONFIG_FUSE_FS|CONFIG_MACH_XIAOMI_SWEET)=' \
              "$DIST/kernel.config"
          } > "$DIST/build-report.txt"

          cd "$DIST"

          sha256sum \
            Image.gz \
            kernel.config \
            kernel-commit.txt \
            build-report.txt \
            > SHA256SUMS

          if [ -f device-trees.tar.gz ]; then
            sha256sum device-trees.tar.gz >> SHA256SUMS
          fi

          echo "ARTIFACTS READY"

      - name: Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sweet-kernel-arm64-build
          path: |
            dist/
            kernel-out/.config
          if-no-files-found: warn
          retention-days: 14
