
name: Sweet Native ARM64 Full Integration

on:
  workflow_dispatch:
    inputs:
      rootfs_run_id:
        description: "Successful RootFS run ID"
        required: true
        default: "42470153204"
        type: string
      kernel_run_id:
        description: "Successful Kernel run ID"
        required: true
        default: "42448931352"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sweet-native-full-integration
  cancel-in-progress: true

jobs:
  integration:
    name: Build Sweet Kernel Modules and Native Initramfs
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git bc bison flex build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            clang-18 llvm-18 llvm-18-tools lld-18 \
            libssl-dev libelf-dev libncurses-dev \
            python3 python-is-python3 \
            dwarves device-tree-compiler \
            cpio gzip xz-utils zstd \
            kmod rsync file \
            curl wget

      - name: Download successful RootFS artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          run_id: ${{ inputs.rootfs_run_id }}
          name: ubuntu-noble-sweet-arm64-rootfs
          path: downloaded/rootfs

      - name: Download successful Kernel artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          run_id: ${{ inputs.kernel_run_id }}
          name: sweet-kernel-arm64-build
          path: downloaded/kernel

      - name: Verify downloaded artifacts
        run: |
          set -Eeuo pipefail

          ROOTFS_TAR="$(find downloaded/rootfs \
            -name ubuntu-noble-sweet-arm64.tar \
            -type f -print -quit)"

          OLD_KERNEL="$(find downloaded/kernel \
            -name Image.gz -type f -print -quit)"

          OLD_CONFIG="$(find downloaded/kernel \
            -name kernel.config -type f -print -quit)"

          test -s "$ROOTFS_TAR"
          test -s "$OLD_KERNEL"
          test -s "$OLD_CONFIG"

          grep -q "DEVICE=sweet" \
            "$(find downloaded/rootfs -name build-info.txt -type f -print -quit)"

          mkdir -p source-info

          printf "%s\n" "$ROOTFS_TAR" > source-info/rootfs-path.txt
          printf "%s\n" "$OLD_KERNEL" > source-info/old-kernel-path.txt
          printf "%s\n" "$OLD_CONFIG" > source-info/old-config-path.txt

          echo "ROOTFS ARTIFACT VERIFIED"
          echo "KERNEL ARTIFACT VERIFIED"

      - name: Prepare and verify LLVM tools
        run: |
          set -Eeuo pipefail

          TOOLS=(
            llvm-nm
            llvm-ar
            llvm-objdump
            llvm-objcopy
            llvm-readelf
            llvm-strip
            llvm-ranlib
            llvm-size
            llvm-strings
          )

          for tool in "${TOOLS[@]}"; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              versioned="${tool}-18"

              if ! command -v "$versioned" >/dev/null 2>&1; then
                echo "ERROR: Missing LLVM tool: $tool"
                exit 1
              fi

              sudo ln -sf "$(command -v "$versioned")" \
                "/usr/local/bin/$tool"
            fi
          done

          for tool in "${TOOLS[@]}"; do
            command -v "$tool"
          done

          command -v ld.lld-18
          command -v clang-18
          command -v aarch64-linux-gnu-gcc

          echo "LLVM TOOLCHAIN VERIFIED"

      - name: Download audited Sweet kernel source
        run: |
          set -Eeuo pipefail

          git init kernel

          git -C kernel remote add origin \
            https://github.com/LineageOS/android_kernel_xiaomi_sm6150.git

          git -C kernel fetch --depth=1 origin \
            e03e5ba22586be70673afb5d3c3f70510524e658

          git -C kernel checkout FETCH_HEAD

          git -C kernel rev-parse HEAD > kernel-commit.txt

          test "$(cat kernel-commit.txt)" = \
            "e03e5ba22586be70673afb5d3c3f70510524e658"

      - name: Fix q6asm format
        run: |
          set -Eeuo pipefail

          FILE="kernel/techpack/audio/dsp/q6asm.c"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          old = 'payload size of %d is less than expected %d.'
          new = 'payload size of %d is less than expected %zu.'

          if new in source:
              print("q6asm fix already applied")
          elif source.count(old) == 1:
              path.write_text(source.replace(old, new, 1))
          else:
              raise SystemExit("ERROR: q6asm source mismatch")
          PY

      - name: Fix IPA QDSS pointer format
        run: |
          set -Eeuo pipefail

          FILE="kernel/drivers/platform/msm/ipa/ipa_v3/ipa_qdss.c"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          old = 'Failed allocating gsi_chan_hdl=%d'
          new = 'Failed allocating gsi_chan_hdl=%p'

          if new in source:
              print("IPA fix already applied")
          elif source.count(old) == 1:
              path.write_text(source.replace(old, new, 1))
          else:
              raise SystemExit("ERROR: IPA QDSS source mismatch")
          PY

      - name: Prepare GCC compatibility wrapper
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchain"

          cat > "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper" <<'EOF'
          #!/usr/bin/env bash
          set -e

          ALLOW_FLOAT=0

          for arg in "$@"; do
            case "$arg" in
              */bq2597x_charger.c|bq2597x_charger.c)
                ALLOW_FLOAT=1
                ;;
            esac
          done

          args=()

          for arg in "$@"; do
            if [ "$arg" = "-mno-implicit-float" ]; then
              if [ "$ALLOW_FLOAT" -eq 1 ]; then
                echo "GCC: allowing FP for bq2597x" >&2
              else
                args+=("-mgeneral-regs-only")
              fi
            else
              args+=("$arg")
            fi
          done

          exec aarch64-linux-gnu-gcc "${args[@]}"
          EOF

          chmod +x "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          printf 'int test(void) { return 0; }\n' > test.c

          "$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper" \
            -mno-implicit-float \
            -c test.c -o test.o

          test -s test.o

          echo "GCC WRAPPER TEST PASSED"

      - name: Fix compiler macro compatibility
        run: |
          set -Eeuo pipefail

          FILE="kernel/include/linux/compiler_types.h"

          python3 - "$FILE" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()

          marker = "#if __has_attribute(__fallthrough__)"

          fallback = (
              "#ifndef __has_attribute\n"
              "#define __has_attribute(x) 0\n"
              "#endif\n\n"
          )

          if marker not in source:
              raise SystemExit("ERROR: Compiler marker not found")

          if "#ifndef __has_attribute" not in source:
              source = source.replace(marker, fallback + marker, 1)
              path.write_text(source)

          print("Compiler compatibility verified")
          PY

      - name: Prepare Sweet native configuration
        run: |
          set -Eeuo pipefail

          KERNEL="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          CC_WRAPPER="$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          mkdir -p "$OUT"

          cd "$KERNEL"

          make O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            vendor/sdmsteppe-perf_defconfig

          cat > "$GITHUB_WORKSPACE/native.config" <<'EOF'
          CONFIG_MODULES=y
          CONFIG_BLK_DEV_INITRD=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_FUSE_FS=y
          CONFIG_EXT4_FS=y
          EOF

          scripts/kconfig/merge_config.sh \
            -m -O "$OUT" \
            "$OUT/.config" \
            "$KERNEL/arch/arm64/configs/vendor/sweet.config" \
            "$GITHUB_WORKSPACE/native.config"

          make O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            olddefconfig

      - name: Verify native kernel configuration
        run: |
          set -Eeuo pipefail

          CONFIG="$GITHUB_WORKSPACE/kernel-out/.config"

          test -s "$CONFIG"

          REQUIRED=(
            CONFIG_MODULES
            CONFIG_BLK_DEV_INITRD
            CONFIG_DEVTMPFS
            CONFIG_DEVTMPFS_MOUNT
            CONFIG_FUSE_FS
            CONFIG_EXT4_FS
            CONFIG_MACH_XIAOMI_SWEET
            CONFIG_TOUCHSCREEN_GOODIX_GTX9896_I2C
            CONFIG_TOUCHSCREEN_FTS_K6
          )

          for symbol in "${REQUIRED[@]}"; do
            if ! grep -qx "${symbol}=y" "$CONFIG"; then
              echo "ERROR: $symbol is not enabled"
              grep -E "^${symbol}=" "$CONFIG" || true
              exit 1
            fi
          done

          echo "NATIVE CONFIGURATION VERIFIED"

      - name: Compile kernel, device trees and modules
        run: |
          set -Eeuo pipefail

          cd "$GITHUB_WORKSPACE/kernel"

          CC_WRAPPER="$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          make -j2 \
            O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            LD=ld.lld-18 \
            KCFLAGS="-Wno-error" \
            Image.gz dtbs modules

          echo "KERNEL AND MODULE COMPILATION FINISHED"

      - name: Install matching kernel modules
        run: |
          set -Eeuo pipefail

          KERNEL="$GITHUB_WORKSPACE/kernel"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          MODROOT="$GITHUB_WORKSPACE/module-root"
          CC_WRAPPER="$GITHUB_WORKSPACE/toolchain/aarch64-gcc-wrapper"

          KREL="$(make -s -C "$KERNEL" O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            kernelrelease)"

          test -n "$KREL"

          make -C "$KERNEL" \
            O="$OUT" \
            ARCH=arm64 \
            CC="$CC_WRAPPER" \
            HOSTCC=gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=0 \
            LD=ld.lld-18 \
            INSTALL_MOD_PATH="$MODROOT" \
            modules_install

          depmod -b "$MODROOT" "$KREL"

          rm -f "$MODROOT/lib/modules/$KREL/build"
          rm -f "$MODROOT/lib/modules/$KREL/source"

          test -s "$MODROOT/lib/modules/$KREL/modules.dep"

          find "$MODROOT/lib/modules/$KREL" \
            -type f -name '*.ko' -print -quit | grep -q .

          printf "%s\n" "$KREL" > kernel-release.txt

          echo "KERNEL RELEASE: $KREL"
          echo "MATCHING MODULES INSTALLED"

      - name: Build minimal ARM64 native initramfs
        run: |
          set -Eeuo pipefail

          KREL="$(cat kernel-release.txt)"
          INITROOT="$GITHUB_WORKSPACE/initramfs-root"
          MODDIR="$GITHUB_WORKSPACE/module-root/lib/modules/$KREL"

          mkdir -p \
            "$INITROOT/bin" \
            "$INITROOT/sbin" \
            "$INITROOT/dev" \
            "$INITROOT/proc" \
            "$INITROOT/sys" \
            "$INITROOT/run" \
            "$INITROOT/newroot" \
            "$INITROOT/lib/modules"

          cp -a "$MODDIR" "$INITROOT/lib/modules/"

          cat > "$INITROOT/init" <<EOF
          #!/bin/busybox sh

          BB=/bin/busybox
          KVER="$KREL"

          export PATH=/sbin:/bin

          echo "[sweet-init] Starting native Ubuntu boot"

          \$BB mount -t proc proc /proc
          \$BB mount -t sysfs sysfs /sys
          \$BB mount -t devtmpfs devtmpfs /dev

          \$BB mkdir -p /run /newroot

          CMDLINE="\$(\$BB cat /proc/cmdline)"

          ROOTDEV=""
          ROOTFSTYPE="ext4"

          for arg in \$CMDLINE; do
            case "\$arg" in
              root=*)
                ROOTDEV="\${arg#root=}"
                ;;
              rootfstype=*)
                ROOTFSTYPE="\${arg#rootfstype=}"
                ;;
            esac
          done

          if [ -z "\$ROOTDEV" ]; then
            echo "[sweet-init] ERROR: root= is missing from kernel command line"
            exec /bin/busybox sh
          fi

          echo "[sweet-init] Loading kernel modules"

          if [ -d "/lib/modules/\$KVER" ]; then
            for module_file in \$(\$BB find "/lib/modules/\$KVER" -type f -name '*.ko'); do
              module="\${module_file##*/}"
              module="\${module%.ko}"
              module="\$(\$BB echo "\$module" | \$BB tr '-' '_')"
              /sbin/modprobe "\$module" 2>/dev/null || true
            done
          fi

          echo "[sweet-init] Waiting for root device: \$ROOTDEV"

          count=0
          while [ ! -b "\$ROOTDEV" ] && [ "\$count" -lt 60 ]; do
            \$BB sleep 1
            count=\$((count + 1))
          done

          if [ ! -b "\$ROOTDEV" ]; then
            echo "[sweet-init] ERROR: root device not found"
            exec /bin/busybox sh
          fi

          echo "[sweet-init] Mounting Ubuntu root filesystem"

          if ! \$BB mount -t "\$ROOTFSTYPE" -o rw "\$ROOTDEV" /newroot; then
            echo "[sweet-init] ERROR: failed to mount root filesystem"
            exec /bin/busybox sh
          fi

          if [ ! -x /newroot/sbin/init ]; then
            echo "[sweet-init] ERROR: /sbin/init not found in root filesystem"
            exec /bin/busybox sh
          fi

          \$BB mkdir -p /newroot/dev /newroot/proc /newroot/sys /newroot/run

          \$BB mount --move /dev /newroot/dev
          \$BB mount --move /proc /newroot/proc
          \$BB mount --move /sys /newroot/sys
          \$BB mount --move /run /newroot/run

          echo "[sweet-init] Starting Ubuntu systemd"

          exec \$BB switch_root /newroot /sbin/init
          EOF

          chmod 0755 "$INITROOT/init"

          sudo mknod -m 600 "$INITROOT/dev/console" c 5 1
          sudo mknod -m 666 "$INITROOT/dev/null" c 1 3

          docker run --rm \
            --platform linux/arm64 \
            --mount "type=bind,source=$INITROOT,target=/out" \
            ubuntu:24.04 \
            bash -Eeuo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update

              apt-get install -y --no-install-recommends \
                busybox-static \
                kmod

              mkdir -p /out/bin /out/sbin

              cp /bin/busybox /out/bin/busybox
              ln -sf busybox /out/bin/sh

              cp -L /usr/bin/kmod /out/sbin/kmod
              ln -sf kmod /out/sbin/modprobe

              ldd /usr/bin/kmod |
                awk "{for (i=1; i<=NF; i++) if (\$i ~ /^\//) print \$i}" |
                sort -u |
                while read -r lib; do
                  mkdir -p "/out$(dirname "$lib")"
                  cp -L "$lib" "/out$lib"
                done

              depmod -b /out "'"$KREL"'"

              echo "ARM64 BUSYBOX AND KMOD READY"
            '

          test -s "$INITROOT/bin/busybox"
          test -s "$INITROOT/sbin/kmod"
          test -s "$INITROOT/lib/modules/$KREL/modules.dep"

          mkdir -p dist

          (
            cd "$INITROOT"
            find . -print0 |
              sort -z |
              cpio --null -o --format=newc
          ) | gzip -9n > dist/native-initramfs.cpio.gz

          test -s dist/native-initramfs.cpio.gz

          echo "NATIVE INITRAMFS CREATED"

      - name: Collect complete integration package
        run: |
          set -Eeuo pipefail

          DIST="$GITHUB_WORKSPACE/dist"
          OUT="$GITHUB_WORKSPACE/kernel-out"
          ROOTFS_TAR="$(find downloaded/rootfs \
            -name ubuntu-noble-sweet-arm64.tar \
            -type f -print -quit)"

          KREL="$(cat kernel-release.txt)"

          mkdir -p "$DIST"

          cp "$OUT/arch/arm64/boot/Image.gz" "$DIST/Image.gz"
          cp "$OUT/.config" "$DIST/kernel.config"
          cp kernel-commit.txt "$DIST/"
          cp kernel-release.txt "$DIST/"

          cp "$ROOTFS_TAR" "$DIST/ubuntu-noble-sweet-arm64.tar"

          tar -czf "$DIST/device-trees.tar.gz" \
            -C "$OUT/arch/arm64/boot" dts

          tar -czf "$DIST/sweet-kernel-modules.tar.gz" \
            -C module-root lib/modules

          cp "$GITHUB_WORKSPACE/dist/native-initramfs.cpio.gz" \
            "$DIST/native-initramfs.cpio.gz"

          printf "%s\n" \
            "DEVICE=sweet" \
            "ARCH=arm64" \
            "OS=Ubuntu 24.04 Noble" \
            "DESKTOP=Lomiri" \
            "INIT=systemd" \
            "KERNEL_RELEASE=$KREL" \
            "MODULES=installed" \
            "INITRAMFS=created" \
            "BUILD_TYPE=native-integration-package" \
            "FLASHABLE=no" \
            > "$DIST/build-info.txt"

          cat > "$DIST/BOOT-NOTES.txt" <<EOF
          SWEET NATIVE UBUNTU ARM64
          ========================

          This artifact contains:
          - Ubuntu Noble ARM64 RootFS TAR
          - ARM64 Image.gz
          - Sweet device trees
          - Matching kernel modules
          - Minimal native initramfs
          - Kernel configuration and build information

          IMPORTANT:
          This package is NOT a flashable boot image.

          The RootFS TAR must first be installed on a dedicated
          Linux-compatible root filesystem partition.

          The initramfs expects a kernel command line containing:
          root=/dev/DEVICE
          rootfstype=ext4

          Do not flash until the root partition, device mapping,
          boot image layout, DTB and DTBO have been validated.

          Keep the original HyperOS boot and recovery backups.
          EOF

          cd "$DIST"

          sha256sum \
            Image.gz \
            kernel.config \
            kernel-commit.txt \
            kernel-release.txt \
            device-trees.tar.gz \
            sweet-kernel-modules.tar.gz \
            native-initramfs.cpio.gz \
            ubuntu-noble-sweet-arm64.tar \
            build-info.txt \
            BOOT-NOTES.txt \
            > SHA256SUMS

          sha256sum -c SHA256SUMS

          echo "COMPLETE INTEGRATION PACKAGE READY"

      - name: Upload complete Native Sweet package
        uses: actions/upload-artifact@v4
        with:
          name: sweet-native-arm64-full-integration
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          
